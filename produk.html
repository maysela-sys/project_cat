<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Produk - Infinity</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="beranda">

  <!-- Gambar latar hero -->
  <div class="hero-bg"></div>

  <!-- Header -->
  <header class="navbar">
    <a href="beranda.html" class="brand">
      <span class="brand-logo" role="img" aria-label="Logo Infinity"></span>
      <span class="brand-name">infinity</span>
    </a>

    <nav class="menu">
      <a href="beranda.html">Beranda</a>
      <a href="produk.html" class="active">Produk</a>
      <a href="#">Tentang Kami</a>
      <a href="#">Lokasi</a>
    </nav>

    <div class="nav-icons">
      <a href="#" aria-label="Keranjang">
        <svg viewBox="0 0 24 24"><path d="M2 3h3l2.4 11.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L21 7H6"/><circle cx="10" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/></svg>
      </a>
      <a href="#" aria-label="Chat" class="open-chat">
        <svg viewBox="0 0 24 24"><path d="M4 4h16a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H9l-5 4V5a1 1 0 0 1 1-1z"/><circle cx="8.5" cy="10.5" r=".6"/><circle cx="12" cy="10.5" r=".6"/><circle cx="15.5" cy="10.5" r=".6"/></svg>
      </a>
      <a href="#" aria-label="Akun">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4.2"/><path d="M3.5 21c.6-4.6 4-7 8.5-7s7.900 2.400 8.500 7z"/></svg>
      </a>
    </div>
  </header>

  <main class="wrap wrap-produk">
    <section class="produk-panel">

      <!-- Pencarian -->
      <form class="search-row" id="searchForm" autocomplete="off">
        <label class="search-box">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/></svg>
          <input type="text" id="searchInput" placeholder="Cari Produk,Kategori, atau Merk....">
        </label>
        <button type="submit" class="btn-cari">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="M16 16l5 5"/></svg>
          Cari
        </button>
      </form>

      <!-- Filter -->
      <div class="filters">
        <select id="filterKategori" aria-label="Kategori"><option value="">Semua Kategori</option></select>
        <select id="filterMerk" aria-label="Merk"><option value="">Semua Merk</option></select>
      </div>

      <!-- Daftar produk (diisi script.js) -->
      <div class="produk-grid" id="produkGrid"></div>
      <p class="produk-kosong hidden" id="produkKosong">Produk tidak ditemukan.</p>

    </section>
  </main>

  <!-- Tombol melayang chat AI -->
  <button type="button" class="chat-fab open-chat" id="chatFab" aria-label="Buka Chat Bot">
    <svg viewBox="0 0 24 24"><path d="M4 4h12a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H8l-4 3.500V5a1 1 0 0 1 1-1z" transform="translate(1 2)"/><path d="M19 2l.7 1.600L21.300 4.300l-1.600.7L19 6.600l-.7-1.600L16.700 4.300l1.600-.7z" fill="#fff" stroke="none"/></svg>
  </button>

  <!-- Pop up Chat Bot -->
  <section class="chat" id="chatBox" aria-hidden="true">
    <header class="chat-head">
      <h3>Chat Bot</h3>
      <button type="button" class="chat-close" id="chatClose" aria-label="Tutup">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </header>

    <div class="chat-body" id="chatBody"></div>

    <div class="chat-chips" id="chatChips">
      <button type="button" class="chip">Warna ruang tamu</button>
      <button type="button" class="chip">Warna kamar tidur</button>
      <button type="button" class="chip">Cat tembok luar rumah</button>
      <button type="button" class="chip">Warna dapur</button>
    </div>

    <form class="chat-input" id="chatForm" autocomplete="off">
      <label class="chat-img" title="Kirim gambar">
        <input type="file" id="chatFile" accept="image/*" hidden>
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="15" height="14" rx="2"/><circle cx="8" cy="9" r="1.500"/><path d="M3 16l5-4 4 3 3-2.500 3 2.500M19 3v6M16 6h6"/></svg>
      </label>
      <input type="text" id="chatText" placeholder="Tulis pesan...">
      <button type="submit" class="chat-send" aria-label="Kirim">
        <svg viewBox="0 0 24 24"><path d="M3 3l18 9-18 9 3-9z" fill="#000"/></svg>
      </button>
    </form>
  </section>

  <script src="../script.js"></script>
</body>
</html>
